project_id = "amanah-apprenticeship-board"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Email OTP only — no password storage, no reset flow to build (plan.md stack rationale).
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6

# The default template sends a magic LINK. Our users get a 6-digit code instead: it is the
# friendlier thing to type on a phone, which is the whole reason we chose OTP over passwords.
[auth.email.template.magic_link]
subject = "Your Amanah sign-in code"
content_path = "./supabase/templates/magic_link.html"
