project_id = "amanah-apprenticeship-board"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Email + password. Accounts are provisioned directly (no self-signup UI), so no confirmation
# email or reset flow is needed — nothing here sends mail.
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
